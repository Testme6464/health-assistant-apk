name: healthassistant
description: "Health Assistant — Burmese health tracker with Firebase sync (offline-first)."
publish_to: "none"
version: 1.0.7+8

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  # Firebase (Spark plan — free, no card). google-services.json is in android/app/.
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.0.0
  # Local storage: secure for API keys, plain JSON cache for offline data.
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  # Connectivity detection for offline-first sync.
  connectivity_plus: ^7.0.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  # Stage 2: food photos, report sharing, backup import.
  image_picker: ^1.1.2
  share_plus: ^13.0.0
  file_picker: ^13.3.2
  health: ^13.3.2
  android_intent_plus: ^6.1.0
  flutter_local_notifications: ^23.0.0
  # System notifications (reminders that fire when the app is closed):
  # timezone for zoned scheduling, path_provider to store a picked
  # ringtone where the system can read it.
  timezone: ^0.11.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
  assets:
    - assets/fonts/NotoSansMyanmar-Regular.ttf
    - assets/sounds/energetic_rock.mp3

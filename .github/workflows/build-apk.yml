name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore binary assets (gradle wrapper jar + launcher icons)
        run: |
          flutter create --org com.tryo --project-name healthassistant --platforms=android /tmp/scratch >/dev/null 2>&1 || true
          cp /tmp/scratch/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          cp /tmp/scratch/android/gradlew android/gradlew
          cp /tmp/scratch/android/gradlew.bat android/gradlew.bat
          chmod +x android/gradlew
          for d in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp /tmp/scratch/android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          ls android/gradle/wrapper/gradle-wrapper.jar android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set — cannot sign the release APK." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          if [ ! -s android/app/release.keystore ]; then
            echo "Decoded release.keystore is empty — check the secret." >&2
            exit 1
          fi
          ls -la android/app/release.keystore

      - name: Create key.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Release signing secrets are not all set." >&2
            exit 1
          fi
          cat > android/key.properties <<EOF
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          storeFile=release.keystore
          EOF
          ls -la android/key.properties

      - name: Analyze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter analyze --no-pub > analyze.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            { echo '## flutter analyze failed'; echo '```'; tail -c 15000 analyze.log; echo '```'; } > analyze-tail.md
            gh issue create --title "Analyze failed (run $GITHUB_RUN_NUMBER)" --body-file analyze-tail.md || true
            exit 1
          fi

      - name: Build release APK (split per ABI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          flutter build apk --release --split-per-abi > build.log 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            { echo '## flutter build apk failed'; echo '```'; tail -c 30000 build.log; echo '```'; } > build-tail.md
            gh issue create --title "APK build failed (run $GITHUB_RUN_NUMBER)" --body-file build-tail.md || true
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Health Assistant v1.0.2 (release)
          body: "Release APK (signed with the release key) built automatically from the main branch."
          files: build/app/outputs/flutter-apk/app-*-release.apk
